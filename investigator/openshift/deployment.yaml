apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator
  namespace: investigator
  labels:
    app: investigator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investigator
  template:
    metadata:
      labels:
        app: investigator
    spec:
      serviceAccountName: investigator
      containers:
        - name: investigator
          image: ghcr.io/bear-redhat/tools/investigator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: HOME
              value: "/tmp"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/aws/token"
            - name: Authentication__ClientId
              valueFrom:
                secretKeyRef:
                  name: investigator-dex-oidc
                  key: client-id
            - name: Authentication__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: investigator-dex-oidc
                  key: client-secret
            # Vertex AI is the only supported model backend. These are set explicitly
            # rather than left to the investigator-config ConfigMap so the deployment is
            # self-describing and a stale appsettings.Production.json cannot silently
            # point the agents at a retired backend -- environment variables win over the
            # mounted JSON. Startup fails loudly if ProjectId or Region is missing.
            - name: Llm__Models__claude-opus__Provider
              value: "vertex"
            - name: Llm__Models__claude-opus__ProjectId
              value: "itpc-gcp-hcm-pe-eng-claude"
            - name: Llm__Models__claude-opus__Region
              value: "us-east5"
            - name: Llm__Models__claude-opus__Model
              value: "claude-opus-4-6"
            - name: Llm__Models__claude-sonnet__Provider
              value: "vertex"
            - name: Llm__Models__claude-sonnet__ProjectId
              value: "itpc-gcp-hcm-pe-eng-claude"
            - name: Llm__Models__claude-sonnet__Region
              value: "us-east5"
            - name: Llm__Models__claude-sonnet__Model
              value: "claude-sonnet-4-6"
          envFrom:
            - configMapRef:
                name: investigator-aws-irsa
                optional: true
            - secretRef:
                name: investigator-env
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /data
            - name: app-config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: gcp-adc
              mountPath: /secrets/gcp
              readOnly: true
            - name: aws-token
              mountPath: /var/run/secrets/aws
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 8Gi
            limits:
              cpu: "2"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: investigator-workspace-data
        - name: app-config
          configMap:
            name: investigator-config
        - name: secrets
          secret:
            secretName: investigator-cluster-creds
            defaultMode: 0600
        - name: gcp-adc
          secret:
            secretName: investigator-gcp-adc
            defaultMode: 0600
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
